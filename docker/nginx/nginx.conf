events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    upstream thingsboard {
        server thingsboard-ce:8080;
    }

    upstream api_gateway {
        server api-gateway:5019;
    }

    upstream ntfy_backend {
        server ntfy:80;
    }

    # ThingsBoard
    server {
        listen 80;
        server_name thingsboard.${NGINX_HOST};

        location / {
            proxy_pass http://thingsboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Gateway
    server {
        listen 80;
        server_name api.${NGINX_HOST};

        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Ntfy
    server {
        listen 80;
        server_name ntfy.${NGINX_HOST};

        location / {
            proxy_pass http://ntfy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}