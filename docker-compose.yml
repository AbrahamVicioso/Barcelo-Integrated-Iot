name: barcelo-iot

networks:
  barcelo-net:
    driver: bridge

volumes:
  sqlserver-data:
  postgres-data:
    name: tb-postgres-data
    driver: local
  kafka-data:
    name: tb-ce-kafka-data
    driver: local
  ntfy-data:

# ── Anchors ──────────────────────────────────────────────────────────────────
x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Docker
  DOTNET_ENVIRONMENT: Docker
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_RUNNING_IN_CONTAINER: "true"

x-db-conn: &db-conn
  ConnectionStrings__DefaultConnection: "Data source=sqlserver;Database=BarceloIoTDatabase;User Id=sa;Password=Testing1234;TrustServerCertificate=True"

x-jwt: &jwt
  Jwt__Issuer: barcelo
  Jwt__Audience: BarceloIoT
  Jwt__Key: u9Z3fBq7M!8@R2L#A4xCkWmP0EJvH5Ys

services:
  # ── Infraestructura ──────────────────────────────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy
    container_name: barcelo-ntfy
    command: serve
    ports:
      - "8081:443"
      - "8082:80"
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_BASE_URL:-https://localhost:8081}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_LISTEN_HTTPS: ":443"
      NTFY_KEY_FILE: /certs/barcelo-dev.key
      NTFY_CERT_FILE: /certs/barcelo-dev.crt
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Siempre deny-all. Sin credenciales configuradas nadie puede suscribirse.
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-deny-all}
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_BEHIND_PROXY: "false"
      NTFY_ENABLE_CORS: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
      - ./docker/certs:/certs:ro
    networks:
      - barcelo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --no-check-certificate https://localhost:443/v1/health -O - | grep -c healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: barcelo-sqlserver
    environment:
      SA_PASSWORD: "Testing1234"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - barcelo-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Testing1234' -Q 'SELECT 1 FROM sys.databases WHERE name=''BarceloIoTDatabase''' -b -No 2>/dev/null | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  kafka:
    image: apache/kafka:4.2.0-rc3
    hostname: kafka
    container_name: kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - barcelo-net

  postgres:
    restart: always
    image: "postgres:16"
    container_name: barcelo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - barcelo-net

  thingsboard-ce:
    restart: always
    image: "thingsboard/tb-node:4.3.0.1"
    container_name: barcelo-thingsboard
    ports:
      - "8080:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:29092
    networks:
      - barcelo-net
    depends_on:
      - postgres
      - kafka

  # ── APIs ──────────────────────────────────────────────────────────────────────
  auth-api:
    build:
      context: .
      dockerfile: Authenticate/Authentication.Api/Dockerfile
    image: barcelo-auth-api:latest
    container_name: barcelo-auth
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5117:5117"
      - "5118:5118"
    environment:
      <<: [*dotnet-env, *db-conn, *jwt]
      KafkaProducer__BootstrapServers: kafka:29092
      KafkaProducer__Topic: users
      KafkaProducer__EmailConfirmationTopic: email-confirmation
      KafkaProducer__PasswordResetTopic: password-reset
      KafkaProducer__ClientId: authentication-api
      AuditProducer__BootstrapServers: kafka:29092
      AuditProducer__Topic: audit.events
      AuditProducer__ClientId: authenticate-audit
      ConfirmEmail__BaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:5019}
      ConfirmEmail__PathPrefix: /api/auth
      Ntfy__BaseUrl: https://ntfy:443
      Ntfy__PublicBaseUrl: http://localhost:5019/ntfy
      Ntfy__IgnoreCertificateErrors: "true"
    networks:
      - barcelo-net
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_started

  usuarios-api:
    build:
      context: .
      dockerfile: Usuarios/Usuarios.API/Dockerfile
    image: barcelo-usuarios-api:latest
    container_name: barcelo-usuarios
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5284:5284"
      - "5285:5285"
    environment:
      <<: [*dotnet-env, *db-conn, *jwt]
      AuditProducer__BootstrapServers: kafka:29092
      AuditProducer__Topic: audit.events
      AuditProducer__ClientId: usuarios-audit
      KafkaProducer__PermisoHabitacion__BootstrapServers: kafka:29092
      KafkaProducer__PermisoHabitacion__Topic: habitacion.permiso-personal
      ExternalServices__Authentication__GrpcUrl: "https://auth-api:5118"
      ExternalServices__Authentication__SkipCertValidation: "true"
      ExternalServices__Dispositivos__GrpcUrl: "https://dispositivos-api:7288"
      ExternalServices__Dispositivos__SkipCertValidation: "true"
    networks:
      - barcelo-net
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-api:
        condition: service_started
      dispositivos-api:
        condition: service_started

  reservas-api:
    build:
      context: .
      dockerfile: Reservas/Reservas.API/Dockerfile
    image: barcelo-reservas-api:latest
    container_name: barcelo-reservas
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5141:5141"
    environment:
      <<: [*dotnet-env, *db-conn, *jwt]
      ASPNETCORE_URLS: "http://+:5141"
      GrpcClients__Usuarios__GrpcUrl: "https://usuarios-api:5285"
      GrpcClients__Usuarios__SkipCertValidation: "true"
      KafkaProducer__BootstrapServers: kafka:29092
      KafkaProducer__Topic: reservas
      KafkaProducer__UnlockDoorTopic: dispositivos.unlock-door
      KafkaProducer__CheckInRealizadoTopic: reservas.checkin-realizado
      KafkaProducer__PersonalUnlockDoorTopic: habitacion.personal-unlock
      KafkaProducer__HabitacionSyncTopic: habitacion.permiso-personal
      KafkaProducer__ClientId: reservas-api
      AuditProducer__BootstrapServers: kafka:29092
      AuditProducer__Topic: audit.events
      AuditProducer__ClientId: reservas-audit
    networks:
      - barcelo-net
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_started
      usuarios-api:
        condition: service_started

  dispositivos-api:
    build:
      context: .
      dockerfile: Dispositivos.API/Dockerfile
    image: barcelo-dispositivos-api:latest
    container_name: barcelo-dispositivos
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5185:5185"
      - "7288:7288"
    environment:
      <<: [*dotnet-env, *db-conn, *jwt]
      Thingsboard__BaseUrl: "http://thingsboard-ce:8080"
      AuditProducer__BootstrapServers: kafka:29092
      AuditProducer__Topic: audit.events
      AuditProducer__ClientId: dispositivos-audit
      KafkaConsumer__UnlockDoor__BootstrapServers: kafka:29092
      KafkaConsumer__UnlockDoor__GroupId: dispositivos-unlock-door-group
      KafkaConsumer__UnlockDoor__Topic: dispositivos.unlock-door
      KafkaConsumer__CheckInRealizado__BootstrapServers: kafka:29092
      KafkaConsumer__CheckInRealizado__GroupId: dispositivos-checkin-group
      KafkaConsumer__CheckInRealizado__Topic: reservas.checkin-realizado
      KafkaConsumer__CheckInRealizado__CredencialesProducerTopic: checkin.credenciales
      KafkaConsumer__PersonalUnlockDoor__BootstrapServers: kafka:29092
      KafkaConsumer__PersonalUnlockDoor__GroupId: dispositivos-personal-unlock-group
      KafkaConsumer__PersonalUnlockDoor__Topic: habitacion.personal-unlock
      KafkaConsumer__PersonalUnlockDoor__PersonalAccesoProducerTopic: habitacion.personal-acceso
      KafkaConsumer__PermisoPersonal__BootstrapServers: kafka:29092
      KafkaConsumer__PermisoPersonal__GroupId: dispositivos-permiso-personal-group
      KafkaConsumer__PermisoPersonal__Topic: habitacion.permiso-personal
    networks:
      - barcelo-net
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    image: barcelo-api-gateway:latest
    container_name: barcelo-gateway
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5019:5019"
      - "5020:5020"
    environment:
      <<: *dotnet-env
      ASPNETCORE_URLS: "http://+:5019;https://+:5020"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/barcelo-dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: barcelo-dev
      GlobalConfiguration__BaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-https://localhost:5020}
    networks:
      - barcelo-net
    depends_on:
      - auth-api
      - usuarios-api
      - reservas-api
      - dispositivos-api
      - audit-worker

  # ── Workers ───────────────────────────────────────────────────────────────────
  notification-worker:
    build:
      context: .
      dockerfile: Notification.Worker/Dockerfile
    image: barcelo-notification-worker:latest
    container_name: barcelo-notification
    volumes:
      - ./docker/certs:/https:ro
    environment:
      <<: *dotnet-env
      KafkaConsumer__UserCreated__BootstrapServers: kafka:29092
      KafkaConsumer__UserCreated__GroupId: notification-user-created-group
      KafkaConsumer__UserCreated__Topic: users
      KafkaConsumer__ReservaCreada__BootstrapServers: kafka:29092
      KafkaConsumer__ReservaCreada__GroupId: notification-reserva-creada-group
      KafkaConsumer__ReservaCreada__Topic: reservas
      KafkaConsumer__EmailConfirmation__BootstrapServers: kafka:29092
      KafkaConsumer__EmailConfirmation__GroupId: notification-email-confirmation-group
      KafkaConsumer__EmailConfirmation__Topic: email-confirmation
      KafkaConsumer__CredencialesCheckIn__BootstrapServers: kafka:29092
      KafkaConsumer__CredencialesCheckIn__GroupId: notification-credenciales-checkin-group
      KafkaConsumer__CredencialesCheckIn__Topic: checkin.credenciales
      KafkaConsumer__PersonalAccesoHabitacion__BootstrapServers: kafka:29092
      KafkaConsumer__PersonalAccesoHabitacion__GroupId: notification-personal-acceso-group
      KafkaConsumer__PersonalAccesoHabitacion__Topic: habitacion.personal-acceso
      KafkaConsumer__PasswordReset__BootstrapServers: kafka:29092
      KafkaConsumer__PasswordReset__GroupId: notification-password-reset-group
      KafkaConsumer__PasswordReset__Topic: password-reset
      EmailSettings__ConnectionString: ${AZURE_COMMUNICATION_CONNECTION_STRING:?EmailSettings__ConnectionString is required. Set AZURE_COMMUNICATION_CONNECTION_STRING in your .env file}
      EmailSettings__Username: ${AZURE_COMMUNICATION_SENDER_ADDRESS:?EmailSettings__Username is required. Set AZURE_COMMUNICATION_SENDER_ADDRESS in your .env file}
      Ntfy__BaseUrl: https://ntfy:443
      Ntfy__TopicPrefix: barcelo
      Ntfy__AccessToken: ${NTFY_SERVER_TOKEN:-}
      Ntfy__AdminPassword: ${NTFY_ADMIN_PASSWORD:-}
      Ntfy__IgnoreCertificateErrors: "true"
      AuthApi__BaseUrl: http://auth-api:5117
    networks:
      - barcelo-net
    depends_on:
      kafka:
        condition: service_started
      ntfy:
        condition: service_healthy

  audit-worker:
    build:
      context: .
      dockerfile: Audit.Worker/Dockerfile
    image: barcelo-audit-worker:latest
    container_name: barcelo-audit
    volumes:
      - ./docker/certs:/https:ro
    ports:
      - "5250:5250"
      - "5251:5251"
    environment:
      <<: [*dotnet-env, *db-conn]
      ASPNETCORE_URLS: "http://+:5250;https://+:5251"
      AuditConsumer__BootstrapServers: kafka:29092
      AuditConsumer__GroupId: audit-worker-group
      AuditConsumer__Topic: audit.events
    networks:
      - barcelo-net
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_started
