# Configuración Dnsmasq para dominio interno smartstay.int
# Resuelve subdominios a localhost (127.0.0.1)

# Puerto listening
port=53

# Interfaz
bind-interfaces

#never-forward plain names (without a dot or domain part)
domain-needed

# Don't read /etc/hosts
no-hosts

# Add local domain suffixes
local=/smartstay.int/

# Resolución de subdominios a localhost
address=/smartstay.int/127.0.0.1

# Subdominios específicos (opcional - todos van a localhost por la regla anterior)
# api.smartstay.int -> localhost
# ntfy.smartstay.int -> localhost
# thingsboard.smartstay.int -> localhost

# Log para debugging
log-queries
log-dhcp

# No cache DNS (opcional para desarrollo)
cache-size=0