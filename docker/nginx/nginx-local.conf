events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # Auth API
    server {
        listen 80;
        server_name auth.smartstay.int;

        location / {
            proxy_pass http://barcelo-auth:5117;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Usuarios API
    server {
        listen 80;
        server_name usuarios.smartstay.int;

        location / {
            proxy_pass http://barcelo-usuarios:5284;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Reservas API
    server {
        listen 80;
        server_name reservas.smartstay.int;

        location / {
            proxy_pass http://barcelo-reservas:5141;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Dispositivos API
    server {
        listen 80;
        server_name dispositivos.smartstay.int;

        location / {
            proxy_pass http://barcelo-dispositivos:5185;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Gateway
    server {
        listen 80;
        server_name api.smartstay.int;

        location / {
            proxy_pass http://barcelo-gateway:5019;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Ntfy
    server {
        listen 80;
        server_name ntfy.smartstay.int;

        location / {
            proxy_pass http://barcelo-ntfy:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ThingsBoard
    server {
        listen 80;
        server_name thingsboard.smartstay.int;

        location / {
            proxy_pass http://barcelo-thingsboard:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default - mostrar estado
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 200 'Barcelo IoT - DNS configured. Use: auth.smartstay.int, api.smartstay.int, ntfy.smartstay.int';
            add_header Content-Type text/plain;
        }
    }
}