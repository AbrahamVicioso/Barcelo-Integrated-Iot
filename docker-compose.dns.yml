# Nginx como reverse proxy para desarrollo local con subdominios .smartstay.int
# Uso: docker compose -f docker-compose.yml -f docker-compose.dns.yml up -d nginx
# Dominio configurado via .env (DOMINIO_PRINCIPAL)

name: barcelo-iot

services:
  nginx:
    image: nginx:latest
    container_name: barcelo-nginx-dns
    profiles:
      - dns
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.template.conf:/etc/nginx/nginx.template.conf:ro
    environment:
      - TZ=America/Santo_Domingo
      - DOMAIN=${DOMINIO_PRINCIPAL:-smartstay.int}
    networks:
      - barcelo-net
    command: >
      sh -c "
        envsubst '$${DOMAIN}' < /etc/nginx/nginx.template.conf > /etc/nginx/nginx.conf && nginx -g 'daemon off;'
      "
    depends_on:
      - api-gateway
      - ntfy

networks:
  barcelo-iot_barcelo-net:
    external: true