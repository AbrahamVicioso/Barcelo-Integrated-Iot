events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    upstream api_gateway {
        server api-gateway:5019;
    }

    upstream thingsboard {
        server thingsboard-ce:8080;
    }

    upstream ntfy_backend {
        server ntfy:80;
    }

    upstream admin_barcelo {
        server barcelo-admin:3000;
    }

    # Admin UI / Frontend (dominio principal: smartstay.int)
    server {
        listen 80;
        server_name ${NGINX_HOST};

        location / {
            proxy_pass http://admin_barcelo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ThingsBoard - subdominio propio
    server {
        listen 80;
        server_name thingsboard.${NGINX_HOST};

        location / {
            proxy_pass http://thingsboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ntfy - HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ntfy.${NGINX_HOST};
        return 301 https://$host$request_uri;
    }

    # ntfy - HTTPS (requerido para Web Push notifications)
    server {
        listen 443 ssl;
        server_name ntfy.${NGINX_HOST};

        ssl_certificate     /etc/letsencrypt/cert.pem;
        ssl_certificate_key /etc/letsencrypt/privkey.pem;

        location / {
            proxy_pass http://ntfy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # API Gateway - todas las APIs
    server {
        listen 80;
        server_name api.${NGINX_HOST};

        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}